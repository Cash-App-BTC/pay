<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cash App Pay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Verified QR Code Styling library -->
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-black text-white flex flex-col justify-between min-h-screen max-w-md mx-auto select-none p-5">

  <!-- Top Status Bar -->
  <div class="flex justify-between items-center pt-2">
    <div class="flex items-center space-x-2 bg-neutral-900 border border-neutral-800 px-3.5 py-1.5 rounded-full">
      <span class="w-2.5 h-2.5 bg-[#00D632] rounded-full animate-pulse"></span>
      <span class="text-xs font-semibold text-neutral-200">Cash App Pay</span>
    </div>
    <div class="text-xs font-mono text-neutral-400 bg-neutral-900 border border-neutral-800 px-3 py-1.5 rounded-full">
      <span id="liveRate">Connecting...</span>
    </div>
  </div>

  <!-- Keypad Display Area -->
  <div class="flex flex-col items-center justify-center my-auto py-6">
    <div class="flex items-baseline justify-center font-extrabold text-[#00D632] tracking-tight">
      <span class="text-4xl sm:text-5xl mr-1 font-bold">$</span>
      <span id="displayAmount" class="text-6xl sm:text-7xl">0</span>
    </div>
    <div class="mt-3 flex items-center space-x-1.5 bg-neutral-900/90 border border-neutral-800 px-4 py-1.5 rounded-full shadow-inner">
      <span class="text-amber-400 text-sm font-bold">₿</span>
      <span id="btcAmount" class="text-neutral-300 font-mono text-sm">0.00000000</span>
    </div>
  </div>

  <!-- Keypad & Submit Area -->
  <div class="w-full">
    <div class="grid grid-cols-3 gap-y-3 gap-x-6 text-center text-2xl font-bold mb-5">
      <button onclick="pressKey('1')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">1</button>
      <button onclick="pressKey('2')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">2</button>
      <button onclick="pressKey('3')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">3</button>
      <button onclick="pressKey('4')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">4</button>
      <button onclick="pressKey('5')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">5</button>
      <button onclick="pressKey('6')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">6</button>
      <button onclick="pressKey('7')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">7</button>
      <button onclick="pressKey('8')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">8</button>
      <button onclick="pressKey('9')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">9</button>
      <button onclick="pressKey('.')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">.</button>
      <button onclick="pressKey('0')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">0</button>
      <button onclick="deleteKey()" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl flex items-center justify-center transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-neutral-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
        </svg>
      </button>
    </div>

    <!-- Main Payment Trigger -->
    <button 
      id="payButton"
      onclick="handlePaymentTrigger()" 
      class="w-full bg-[#00D632] hover:bg-[#00ba2b] active:scale-[0.98] text-black font-extrabold text-lg py-4 rounded-full transition shadow-lg shadow-green-500/20"
    >
      Pay with Cash App
    </button>
  </div>

  <!-- Cash App QR Interface Modal -->
  <div id="qrModal" class="hidden fixed inset-0 bg-black/95 backdrop-blur-md flex flex-col items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-white text-black w-full max-w-[340px] rounded-[36px] p-6 shadow-2xl relative text-center">
      
      <!-- Top Cash App User Info -->
      <div class="text-left mb-3">
        <h2 id="cardDisplayName" class="text-2xl font-extrabold text-neutral-900 tracking-tight leading-tight">Eric jason</h2>
        <p id="cardCashtag" class="text-sm font-semibold text-neutral-500">$Ericjason7</p>
      </div>

      <!-- Rounded Cash App QR Matrix -->
      <div class="relative flex justify-center items-center my-2 bg-white rounded-2xl">
        <div id="qrCanvasContainer" class="flex justify-center items-center min-h-[260px] min-w-[260px]"></div>
      </div>

      <!-- Payment Breakdown -->
      <div class="mt-3 pt-3 border-t border-neutral-100 text-left space-y-1.5">
        <div class="flex justify-between items-center text-xs">
          <span class="text-neutral-500 font-medium">Amount Due:</span>
          <span id="modalBtc" class="font-mono font-bold text-neutral-900 text-sm">0 BTC</span>
        </div>
        <div class="flex justify-between items-center text-xs">
          <span class="text-neutral-500 font-medium">Address:</span>
          <button onclick="copyAddress()" class="text-green-600 hover:text-green-700 font-semibold flex items-center space-x-1">
            <span id="copyBtnText">Copy Address</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Dismiss Modal Button -->
    <button 
      onclick="closeModal()" 
      class="mt-6 bg-neutral-900 border border-neutral-800 hover:bg-neutral-800 text-white font-bold py-3.5 px-10 rounded-full text-sm transition"
    >
      Dismiss
    </button>
  </div>

  <script>
    // ----------------------------------------------------
    // CONFIGURATION
    // ----------------------------------------------------
    const BTC_ADDRESS = "144riwNanTYo6V3PpznqhUnmqFZtkJKSt8";
    const DISPLAY_NAME = "Celine Alva";
    const CASHTAG = "";

    // Cash App Green Logo Vector Badge
    const CASHAPP_SVG_ICON = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="140" fill="#00D632"/>
        <path fill="#FFFFFF" d="M280.9 144c-10.4 0-18.9 8.5-18.9 18.9v14.6c-45.2 6.8-74.1 37.7-74.1 76.7 0 46.5 39.5 64.9 79.5 78.4 34.3 11.6 42.6 23.3 42.6 37.9 0 18.2-17.1 30.5-42.6 30.5-30.8 0-52.7-13.4-58.4-37.9-2.3-9.8-11.4-16.7-21.5-16.7-11.5 0-20.6 8.9-20.6 20.3 0 3.7 1 7.3 2.9 10.4 12.3 36.6 44 58.7 78.2 63.8v16.2c0 10.4 8.5 18.9 18.9 18.9s18.9-8.5 18.9-18.9v-13.9c50.1-7.9 80-40.4 80-80.9 0-44.4-35.8-64.8-81-78.5-33.1-10-41.1-20.8-41.1-36.9 0-16.7 16.3-28.1 39.2-28.1 26.2 0 45.4 10.9 53 31.9 2.5 7.4 9.5 12.8 17.8 12.8 11 0 19.6-8.6 19.6-19.6 0-3.7-.9-7.3-2.7-10.3-11.3-30.7-38.3-50.5-70.2-56.5v-14.8c0-10.4-8.5-18.9-18.9-18.9z"/>
      </svg>
    `);

    document.getElementById("cardDisplayName").innerText = DISPLAY_NAME;
    document.getElementById("cardCashtag").innerText = CASHTAG;

    let rawAmount = "0";
    let btcRate = 0;
    let qrCodeStyling = null;

    // Dual-Source Live Rate Fetcher
    async function initExchangeRate() {
      try {
        const res = await fetch("https://api.coinbase.com/v2/prices/spot?currency=USD");
        const json = await res.json();
        btcRate = parseFloat(json.data.amount);
      } catch (err) {
        try {
          // Fallback to Binance public ticker if Coinbase is blocked
          const resBackup = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT");
          const jsonBackup = await resBackup.json();
          btcRate = parseFloat(jsonBackup.price);
        } catch (e) {
          btcRate = 65000; // Safe fallback price
        }
      }
      document.getElementById("liveRate").innerText = `$${btcRate.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      updateConversion();
    }
    initExchangeRate();

    function pressKey(key) {
      if (key === ".") {
        if (rawAmount.includes(".")) return;
        rawAmount += ".";
      } else {
        if (rawAmount === "0") {
          rawAmount = key;
        } else {
          if (rawAmount.includes(".") && rawAmount.split(".")[1].length >= 2) return;
          rawAmount += key;
        }
      }
      renderDisplay();
    }

    function deleteKey() {
      if (rawAmount.length <= 1) {
        rawAmount = "0";
      } else {
        rawAmount = rawAmount.slice(0, -1);
      }
      renderDisplay();
    }

    function renderDisplay() {
      document.getElementById("displayAmount").innerText = rawAmount;
      updateConversion();
    }

    function updateConversion() {
      const val = parseFloat(rawAmount);
      if (val > 0 && btcRate > 0) {
        const satoshis = (val / btcRate).toFixed(8);
        document.getElementById("btcAmount").innerText = satoshis;
      } else {
        document.getElementById("btcAmount").innerText = "0.00000000";
      }
    }

    function handlePaymentTrigger() {
      const val = parseFloat(rawAmount);
      if (!val || val <= 0) {
        alert("Please enter a valid amount.");
        return;
      }

      const satoshis = (val / btcRate).toFixed(8);
      
      // Standard BIP-21 Bitcoin URI
      const standardBitcoinUri = `bitcoin:${BTC_ADDRESS}?amount=${satoshis}`;
      
      // Cash App custom deep-link scheme
      const cashAppDeepLink = `cashapp://bitcoin?address=${BTC_ADDRESS}&amount=${satoshis}`;

      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isMobile) {
        // Attempt custom Cash App route, fallback to default wallet handler
        window.location.href = cashAppDeepLink;
        setTimeout(() => {
          window.location.href = standardBitcoinUri;
        }, 500);
      } else {
        renderCashAppQR(standardBitcoinUri);
        document.getElementById("modalBtc").innerText = `${satoshis} BTC ($${rawAmount})`;
        document.getElementById("qrModal").classList.remove("hidden");
      }
    }

    // High-Resolution Cash App Dot Matrix Renderer
    function renderCashAppQR(paymentData) {
      const container = document.getElementById("qrCanvasContainer");
      container.innerHTML = "";

      qrCodeStyling = new QRCodeStyling({
        width: 260,
        height: 260,
        type: "canvas",
        data: paymentData,
        image: CASHAPP_SVG_ICON,
        margin: 0,
        qrOptions: {
          typeNumber: 0,
          mode: "Byte",
          errorCorrectionLevel: "H"
        },
        imageOptions: {
          hideBackgroundDots: true,
          imageSize: 0.28,
          margin: 6
        },
        dotsOptions: {
          color: "#000000",
          type: "dots"
        },
        cornersSquareOptions: {
          color: "#000000",
          type: "extra-rounded"
        },
        cornersDotOptions: {
          color: "#000000",
          type: "dot"
        },
        backgroundOptions: {
          color: "#FFFFFF"
        }
      });

      qrCodeStyling.append(container);
    }

    function copyAddress() {
      navigator.clipboard.writeText(BTC_ADDRESS).then(() => {
        const btn = document.getElementById("copyBtnText");
        btn.innerText = "Copied!";
        setTimeout(() => { btn.innerText = "Copy Address"; }, 2000);
      });
    }

    function closeModal() {
      document.getElementById("qrModal").classList.add("hidden");
    }
  </script>
</body>
</html>
